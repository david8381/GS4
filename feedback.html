<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feedback - GS4 Tools</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Besley:wght@400;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-page="feedback">
    <div class="page">
      <div data-header></div>

      <main class="calculator">
        <section class="calc-intro">
          <p class="eyebrow">GS4 Tools</p>
          <h1>Feedback</h1>
          <p>Bug reports, feature requests, questions — all welcome.</p>
        </section>

        <section class="calc-panel feedback-panel">
          <form
            class="feedback-form"
            action="https://formsubmit.co/contact@rainmath.com"
            method="POST"
          >
            <input type="hidden" name="_subject" value="GS4 Tools Feedback" />
            <input type="hidden" name="_captcha" value="true" />
            <input type="hidden" name="_next" value="https://david8381.github.io/GS4/feedback.html?sent=1" />
            <input type="text" name="_honey" style="display:none" />

            <div class="input-group compact-field">
              <label for="feedbackName">Name (optional)</label>
              <div class="input-row">
                <input id="feedbackName" type="text" name="name" placeholder="Character name, Discord handle, etc." />
              </div>
            </div>

            <div class="input-group compact-field">
              <label for="feedbackEmail">Email (optional)</label>
              <div class="input-row">
                <input id="feedbackEmail" type="email" name="email" placeholder="Only if you want a reply" />
              </div>
            </div>

            <div class="input-group compact-field">
              <label for="feedbackCategory">Category</label>
              <div class="input-row">
                <select id="feedbackCategory" name="category">
                  <option value="bug">Bug Report</option>
                  <option value="feature">Feature Request</option>
                  <option value="data">Data Error</option>
                  <option value="question">Question</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>

            <div class="input-group compact-field">
              <label for="feedbackPage">Which page? (optional)</label>
              <div class="input-row">
                <select id="feedbackPage" name="page">
                  <option value="">General / Not specific</option>
                  <option value="profile">Character Profile</option>
                  <option value="spells">Spell Effects / CS-TD</option>
                  <option value="stat-optimizer">Stat Optimizer</option>
                  <option value="societies">Societies</option>
                  <option value="profession-services">Profession Resources</option>
                  <option value="encumbrance">Encumbrance</option>
                  <option value="calculator">Experience Calculator</option>
                  <option value="lumnis">Lumnis + Tutelage</option>
                  <option value="badge">Badge Planner</option>
                  <option value="ambush">Aiming &amp; Ambush</option>
                  <option value="violet-orb">Violet Orb Odds</option>
                </select>
              </div>
            </div>

            <div class="input-group compact-field">
              <label for="feedbackMessage">Message</label>
              <div class="input-row">
                <textarea id="feedbackMessage" name="message" rows="6" required placeholder="What's on your mind?"></textarea>
              </div>
            </div>

            <div class="input-group inline-actions">
              <button class="btn" type="submit">Send Feedback</button>
            </div>
          </form>

          <div class="feedback-sent" id="feedbackSent" style="display:none">
            <p>Thanks for the feedback! If you included an email, I may follow up.</p>
            <a href="index.html" class="btn ghost">Back to Tools</a>
          </div>
        </section>
      </main>

      <div data-footer></div>
    </div>

    <script src="shared.js?v=0.3.33"></script>
    <script src="site.js?v=0.3.33"></script>
    <script>
      if (new URLSearchParams(window.location.search).has("sent")) {
        const form = document.querySelector(".feedback-form");
        const sent = document.getElementById("feedbackSent");
        if (form) form.style.display = "none";
        if (sent) sent.style.display = "block";
        history.replaceState(null, "", window.location.pathname);
      }
    </script>
  </body>
</html>
